[project]
name = "predmaint"
version = "2.0.0"
description = "Remaining-useful-life prediction for NASA C-MAPSS turbofan engines, with calibrated uncertainty, explanations and a live replay dashboard."
requires-python = ">=3.15"
authors = [{ name = "easensoy" }]
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "torch>=2.15",
    "flask>=3.1",
    "flask-socketio>=5.5",
    "simple-websocket>=1.1",
    "gunicorn>=23",
]

[project.optional-dependencies]
notes = [
    "anthropic>=1.0",
]

[dependency-groups]
analysis = [
    "lightgbm>=4.7",
    "matplotlib>=3.11",
]
dev = [
    { include-group = "analysis" },
    "mypy>=1.18",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=8.4",
    "ruff>=0.14",
    "types-flask-socketio>=5.7.0.20261103",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predmaint"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
allowed-confusables = ["–", "−", "·"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.15"
files = ["src"]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# anthropic is the optional `notes` extra, absent from a plain `uv sync`.
module = ["sklearn.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true
