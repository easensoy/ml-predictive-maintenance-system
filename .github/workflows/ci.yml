name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-maintenance
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: predictive-maintenance/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (synthetic data)
        run: uv run pytest
      - name: Audit the published numbers against the committed predictions
        run: uv run python -m predmaint.audit
      - name: Rebuild the figures from the committed artifacts
        run: uv run python -m predmaint.figures --out "$RUNNER_TEMP/figures"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t predmaint predictive-maintenance
      - name: Smoke-test the container
        run: |
          docker run -d --name predmaint -p 8000:8000 predmaint
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && exit 0; sleep 2; done
          docker logs predmaint
          exit 1
